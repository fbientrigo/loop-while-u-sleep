[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "Auditable local supervisor foundation for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gauntlet = ["schemas/*.json"]
